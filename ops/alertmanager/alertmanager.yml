# Local/test routing only: every alert goes to a webhook on this machine, so validating the rules
# never contacts a real person or a paid service. Point a real deployment at its own receiver.
route:
  receiver: local-sink
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-sink
    webhook_configs:
      - url: http://127.0.0.1:9095/alerts
        send_resolved: true
