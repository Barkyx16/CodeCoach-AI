name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codecoach
          POSTGRES_PASSWORD: codecoach
          POSTGRES_DB: codecoach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codecoach" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_test
        run: pytest
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Reference solutions pass every seeded test
        run: python scripts/verify_reference_solutions.py

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codecoach-api:ci backend
