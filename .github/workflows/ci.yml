name: CI

# One run per change (docs/CI.md): pull requests run as pull_request; pushes run only on the
# long-lived branches (a push to a pull request's branch used to start a second, identical run).
# workflow_dispatch runs everything on any branch: the full route for release candidates.
on:
  push:
    branches: [main, master, feature/premium-frontend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Which checks this change needs
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.classify.outputs.lanes }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      e2e: ${{ steps.classify.outputs.e2e }}
      runner: ${{ steps.classify.outputs.runner }}
      sandbox: ${{ steps.classify.outputs.sandbox }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        # Pull requests: everything the pull request changes against its base (not only the last
        # push). Pushes: since the previous head. Manual runs and the long-lived branches' first
        # push: everything. Unknown or unreadable: everything (scripts/ci_classify.py).
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python scripts/ci_classify.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = push ]; then
            python scripts/ci_classify.py --base "${{ github.event.before }}" --head "${{ github.sha }}"
          else
            python scripts/ci_classify.py --full
          fi

  backend:
    name: Backend (lint, types, SQLite tests, reference solutions)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app evals  # evals too since the Verification batch (clean: 0 errors)
      - name: Tests (SQLite)
        run: pytest
      - name: Reference solutions pass every seeded test
        run: python scripts/verify_reference_solutions.py

  # The PostgreSQL half runs beside the SQLite half on its own runner and database server (it was
  # the second half of one 56-minute job): nothing is shared between them.
  backend-pg:
    name: Backend on PostgreSQL (tests as the app role, migrations, content gates)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codecoach
          POSTGRES_PASSWORD: codecoach
          POSTGRES_DB: codecoach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codecoach -d codecoach_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-dev.txt
      - name: An ordinary database role for the app (superusers bypass row-level security)
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine(
              "postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_test", isolation_level="AUTOCOMMIT"
          )
          with e.connect() as c:
              c.execute(text("CREATE ROLE codecoach_app LOGIN PASSWORD 'codecoach' NOSUPERUSER NOBYPASSRLS"))
              c.execute(text("CREATE DATABASE codecoach_app_test OWNER codecoach_app"))
          PY
      - name: Tools for the storage and backup rehearsals (psql runs the role script; age encrypts backups)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
      - name: Tests (PostgreSQL, as that role, so row-level security is enforced)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://codecoach_app:codecoach@localhost:5432/codecoach_app_test
          # The service's superuser, for tests/test_storage.py's rehearsals only: they create and drop
          # their own codecoach_rehearsal_* databases and roles (owner/app split, upgrades, copy).
          TEST_DATABASE_ADMIN_URL: postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_test
        run: pytest
      # On a database the check makes and drops itself (never the test database): upgrade from the
      # previous revision with records in place, models match, the latest step down and up, base
      # and back. It exits nonzero on any failed step, and prints MIGRATIONS-OK only after all.
      - name: Migrations apply cleanly and match the models
        run: python scripts/check_migrations.py --admin-url postgresql+psycopg://codecoach:codecoach@localhost:5432/postgres
      - name: Content quality gates (questions, corrections, lessons, scenarios, problems)
        env:
          DATABASE_URL: postgresql+psycopg://codecoach:codecoach@localhost:5432/codecoach_content_check
          PGPASSWORD: codecoach
        run: |
          createdb -h localhost -U codecoach codecoach_content_check
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli validate-content

  frontend:
    name: Frontend (lint, types, unit tests, build, API contract)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: API types match docs/openapi.json
        run: npm run api:check
      - name: Unit + integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle size budgets (shell and largest lazy chunk, gzipped)
        run: npm run size:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: End-to-end (Playwright, real backend)
    # Doesn't wait for the backend and frontend jobs any more: it uses nothing they make, and the
    # wait put 16 minutes after the backend's 56 on the critical path.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
      - name: The production web image's Content-Security-Policy, from the browser (bad URLs fail the build; real flows pass; foreign fetches and scripts are refused)
        run: scripts/rehearse_web_csp.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  runner:
    name: Runner (lint, types, unit tests)
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: Unit tests (sandbox tests are skipped here; see the sandbox job)
        run: pytest -m "not sandbox"

  sandbox:
    name: Sandbox (gVisor threat model + real judge + judge e2e)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    env:
      # Pinned gVisor release, verified by checksum below. Bump deliberately.
      GVISOR_RELEASE: "20260714.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            runner/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install gVisor (runsc) and register it with Docker
        run: |
          set -euo pipefail
          URL="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64"
          curl -fsSL -o runsc "$URL/runsc"
          curl -fsSL -o runsc.sha512 "$URL/runsc.sha512"
          sha512sum -c runsc.sha512
          chmod +x runsc && sudo mv runsc /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
          docker run --rm --runtime=runsc alpine:3.20 uname -r | grep -q gvisor
      - name: Build the sandbox image
        run: docker build -t codecoach-java-sandbox:21 runner/sandbox-image
      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt -r runner/requirements-dev.txt
      - name: Threat-model tests (hostile code in the real sandbox)
        working-directory: runner
        run: pytest -m sandbox -v
      - name: Real judge (API → worker → runner → gVisor)
        working-directory: backend
        run: pytest -m sandbox -v
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Judge end-to-end (browser → API → worker → runner → gVisor)
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
          E2E_JUDGE: "1"
        # Through the launcher, like every other e2e run: it owns and stops what the run starts.
        run: npm run e2e -- e2e/judge.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sandbox-traces
          path: frontend/test-results/
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 detect-secrets==1.5.0
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r runner/requirements.txt
      - name: No unreviewed secrets in tracked files (detect-secrets against .secrets.baseline)
        run: python scripts/check_secrets.py

  docker:
    name: Docker images build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codecoach-api:ci backend
      - name: Every API-image entrypoint imports with runtime dependencies only
        run: |
          docker run --rm -e RUNNER_TOKEN=x codecoach-api:ci python -c "import app.main, app.worker, app.cli"
      - run: docker build -t codecoach-web:ci frontend
      - name: The backup image's pg_dump and pg_restore are the server's major version, and age is there
        run: |
          docker build --target backup -t codecoach-backup:ci backend
          server=$(grep -oE 'image: postgres:[0-9]+' deploy/docker-compose.production.yml | grep -oE '[0-9]+$')
          docker run --rm -e SERVER="$server" codecoach-backup:ci sh -c '
            for tool in pg_dump pg_restore; do
              v=$($tool --version | grep -oE "\(PostgreSQL\) [0-9]+" | grep -oE "[0-9]+$")
              [ "$v" = "$SERVER" ] || { echo "$tool $v, but the server is PostgreSQL $SERVER"; exit 1; }
            done
            pg_dump --version && age --version && python -m app.cli prune-backups --dir /backups'
      - name: Production compose rehearsal (owner/app roles, restarts, readiness, web CSP, scheduled backup and restore)
        run: |
          docker build --build-arg VITE_API_BASE_URL=https://rehearsal.invalid -t codecoach-web:rehearsal frontend
          IMAGE=codecoach-api:ci BACKUP_IMAGE=codecoach-backup:ci WEB_IMAGE=codecoach-web:rehearsal \
            scripts/rehearse_production_storage.sh
      - run: docker build -t codecoach-runner:ci runner
      - run: docker run --rm codecoach-runner:ci python -c "import app.main"
      - run: docker build -t codecoach-java-sandbox:ci runner/sandbox-image

  # The one conclusion to require (docs/CI.md): which jobs this change needed, and whether each
  # succeeded, for this exact event and SHA. Fails closed: a required job that failed, was
  # cancelled or skipped, a job that ran and failed, or no classification at all.
  summary:
    name: CI summary
    needs: [changes, security, backend, backend-pg, frontend, e2e, runner, sandbox, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_summary.py
