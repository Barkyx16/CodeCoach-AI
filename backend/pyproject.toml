[project]
name = "codecoach-backend"
version = "0.1.0"
description = "CodeCoach AI API: problem library, submissions, and AI coaching."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "anthropic>=2.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sandbox: needs Docker with the gVisor (runsc) runtime and the sandbox image; auto-skipped otherwise"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "E501",   # line length is enforced by `ruff format`; long string literals are allowed
    "UP046",  # keep typing.Generic: clearer for readers new to Python 3.12 generics
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
