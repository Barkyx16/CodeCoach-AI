server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # NOTE: nginx drops server-level add_header directives in any location that declares its
  # own add_header, so the security headers are included in every location explicitly.

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The service worker and manifest must always be revalidated, or an update could be missed.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve the app shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
